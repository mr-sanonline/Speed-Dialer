<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><style>body{margin:0;background:#EDEAE4;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:#0B6E3F}a:hover{color:#08542f}</style></helmet>
<div style="display:flex;justify-content:center;padding:28px 16px">
<div style="width:390px;height:844px;background:#FAF8F4;border-radius:38px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;color:#141414">
  <div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600"><span>9:41</span><span style="opacity:.55">Farm land · Sheet 1</span></div>
  <div style="padding:6px 22px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(0,0,0,.09)">
    <div style="font-size:12px;font-weight:700;letter-spacing:.5px;color:#0B6E3F">LEAD {{ idxLabel }}</div>
    <div style="flex:1;height:4px;background:rgba(0,0,0,.09);border-radius:2px;overflow:hidden"><div style="height:100%;width:{{ pct }};background:#0B6E3F"></div></div>
    <div style="font-size:12px;font-weight:600;opacity:.5">{{ remaining }} left</div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:22px 22px 8px">
    <div style="font-size:34px;font-weight:700;letter-spacing:-1.1px;line-height:1.08">{{ name }}</div>
    <a href="{{ tel }}" style="display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-top:6px;text-decoration:none;color:#0B6E3F">{{ phone }}</a>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <sc-for list="{{ outcomes }}" as="o" hint-placeholder-count="5">
        <button onClick="{{ o.onClick }}" style="{{ o.style }}">{{ o.label }}</button>
      </sc-for>
    </div>
    <div style="height:1px;background:rgba(0,0,0,.09);margin:20px 0 18px"></div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div><div style="font-size:10px;font-weight:700;letter-spacing:.7px;opacity:.5;margin-bottom:6px">PREFERRED LOCATION</div><input placeholder="Type area" style="width:100%;box-sizing:border-box;padding:14px;border:none;border-bottom:2px solid rgba(0,0,0,.16);font-size:17px;background:#F3F0E9;border-radius:8px 8px 0 0;font-family:inherit"></div>
      <div><div style="font-size:10px;font-weight:700;letter-spacing:.7px;opacity:.5;margin-bottom:6px">PROPERTY TYPE</div>
        <div style="display:flex;flex-wrap:wrap;gap:7px"><sc-for list="{{ ptypes }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.onClick }}" style="{{ p.style }}">{{ p.label }}</button></sc-for></div>
      </div>
      <div><div style="font-size:10px;font-weight:700;letter-spacing:.7px;opacity:.5;margin-bottom:6px">CONFIGURATION <span style="font-weight:500;letter-spacing:0">— free text</span></div><input placeholder="3BHK · 30x40 · 2 acres" style="width:100%;box-sizing:border-box;padding:14px;border:none;border-bottom:2px solid rgba(0,0,0,.16);font-size:17px;background:#F3F0E9;border-radius:8px 8px 0 0;font-family:inherit"></div>
      <div><div style="font-size:10px;font-weight:700;letter-spacing:.7px;opacity:.5;margin-bottom:6px">BUDGET</div>
        <div style="display:flex;flex-wrap:wrap;gap:7px"><sc-for list="{{ budgets }}" as="b" hint-placeholder-count="5"><button onClick="{{ b.onClick }}" style="{{ b.style }}">{{ b.label }}</button></sc-for></div>
      </div>
      <div><div style="font-size:10px;font-weight:700;letter-spacing:.7px;opacity:.5;margin-bottom:6px">SUGGESTED PROJECT</div><input placeholder="Start typing…" style="width:100%;box-sizing:border-box;padding:14px;border:none;border-bottom:2px solid rgba(0,0,0,.16);font-size:17px;background:#F3F0E9;border-radius:8px 8px 0 0;font-family:inherit"></div>
      <div><div style="font-size:10px;font-weight:700;letter-spacing:.7px;opacity:.5;margin-bottom:6px">NOTES — ONE PER LINE</div><textarea rows="3" placeholder="Visiting Bengaluru next month&#10;Prefers north-facing" style="width:100%;box-sizing:border-box;padding:14px;border:none;border-bottom:2px solid rgba(0,0,0,.16);font-size:17px;background:#F3F0E9;border-radius:8px 8px 0 0;font-family:inherit;resize:none"></textarea></div>
      <div style="font-size:12px;opacity:.45;padding-bottom:6px">Saved on device · sheet sync pending</div>
    </div>
  </div>
  <div style="padding:12px 18px 24px;border-top:1px solid rgba(0,0,0,.09);display:flex;gap:10px;background:#FAF8F4">
    <a href="{{ tel }}" style="flex:1;padding:19px;border-radius:12px;background:#0B6E3F;color:#FAF8F4;font-size:18px;font-weight:700;text-align:center;text-decoration:none;letter-spacing:-.2px">Call now</a>
    <button onClick="{{ onNext }}" style="padding:19px 20px;border:1px solid rgba(0,0,0,.22);border-radius:12px;background:transparent;font-size:16px;font-weight:600;font-family:inherit;white-space:nowrap">Next →</button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { i: 0, outcome: null, ptype: "Farm plot", budget: null };
  leads = [
    {name:"Ravi Kumar", phone:"+91 98450 11234"},
    {name:"Sneha Reddy", phone:"+91 99012 44781"},
    {name:"Mohan Rao", phone:"+91 90080 23119"}
  ];
  pill(active, big) {
    return `padding:${big?"11px 15px":"10px 13px"};border-radius:22px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid ${active?"#0B6E3F":"rgba(0,0,0,.18)"};background:${active?"#0B6E3F":"transparent"};color:${active?"#FAF8F4":"#141414"}`;
  }
  renderVals() {
    const total = 200, cur = this.leads[this.state.i % this.leads.length];
    const set = (k) => (v) => this.setState({[k]: v});
    return {
      name: cur.name, phone: cur.phone, tel: "tel:"+cur.phone.replace(/\s/g,""),
      idxLabel: (48 + this.state.i) + " of " + total,
      pct: ((48+this.state.i)/total*100).toFixed(1)+"%",
      remaining: total - 48 - this.state.i,
      outcomes: ["Interested","Call back later","No answer","Switched off","Not interested"].map(label => ({
        label, style: this.pill(this.state.outcome===label),
        onClick: () => set("outcome")(label)
      })),
      ptypes: ["Apartment","Villa / independent","Plot","Farm plot"].map(label => ({
        label, style: this.pill(this.state.ptype===label, true), onClick: () => set("ptype")(label)
      })),
      budgets: ["<₹50L","₹50L–1Cr","₹1–2Cr","₹2–5Cr","₹5Cr+"].map(label => ({
        label, style: this.pill(this.state.budget===label, true), onClick: () => set("budget")(label)
      })),
      onNext: () => this.setState({i: this.state.i+1, outcome: null, budget: null})
    };
  }
}
</script>
</body>
</html>
